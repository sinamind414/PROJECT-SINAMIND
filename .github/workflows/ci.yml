name: CI/CD Khawarizmi Pro

on:
  push:
    branches: [master, "arena/**"]
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: khawarizmi_test
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd khawarizmi-backend
          pip install -r requirements.txt

      - name: Run backend smoke test
        env:
          SECRET_KEY: ci-test-key-for-smoke-tests-only
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost/khawarizmi_test
          ENVIRONMENT: ci
          REDIS_URL: redis://localhost:6379/0
          GEMINI_API_KEY: test
          OPENAI_API_KEY: test
        run: |
          cd khawarizmi-backend
          python -c "from config import get_settings; cfg = get_settings(); print(f'Settings OK: {bool(cfg.SECRET_KEY)}'); print(cfg.DATABASE_URL); print(cfg.ENVIRONMENT)"

      - name: Run backend tests
        run: |
          cd khawarizmi-backend
          pip install pytest pytest-asyncio httpx
          pytest -q

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: khawarizmi-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: khawarizmi-frontend

      - name: Lint
        run: npm run lint
        working-directory: khawarizmi-frontend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: khawarizmi-frontend

      - name: Tests
        run: npm run test
        working-directory: khawarizmi-frontend

      - name: Build
        run: npm run build
        working-directory: khawarizmi-frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy-railway:
    if: github.ref == 'refs/heads/master'
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach --service PROJECT-SINAMIND --environment production
        working-directory: khawarizmi-backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
